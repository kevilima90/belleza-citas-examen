<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#7b3158">
    <title>Sin conexión | Belleza Citas</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <main class="container py-5">
        <section class="empty-state mt-5">
            <span class="service-mark mb-3">BC</span>
            <h1 class="h3 fw-bold">No tienes conexión a Internet</h1>
            <p class="text-secondary">La aplicación está instalada, pero para consultar o modificar citas necesitas volver a conectarte.</p>
            <button class="btn btn-primary" onclick="window.location.reload()">Intentar nuevamente</button>
        </section>
    </main>
</body>
</html>
